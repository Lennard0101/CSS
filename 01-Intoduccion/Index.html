<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción a CSS</title>
</head>
<body>
    <!-- 1. CSS dentro del elemento <style>...</style> -->
     <Style>
    h1 {
        color: red;
        font-size: 67px;
    }
     </Style>

    <h1>Introducción a CSS</h1>

    <!-- 2. Escribimos CSS en linea. Dentro de la etiqueta de apertura de un elemento de HTML -->

    <p style="color: blue; font-size: 20px;">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ipsam mollitia, perferendis corrupti numquam explicabo consequuntur magnam voluptatum facere illum non, obcaecati dolorum aspernatur sit amet dolore eum veritatis earum fuga!</p>

    <!-- 3. Escribimos CSS en un archivo externo y lo llamamos a traves de la etiqueta <link> -->

    <h2>CSS en un archivo externo</h2>
    <link rel="stylesheet" href="./Style.css">
</body>
</html>
